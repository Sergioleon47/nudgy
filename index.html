  function renderNoteText(container, rawText){
    container.innerHTML = '';

    var names = contacts.slice().sort(function(a,b){ return b.name.length - a.name.length; }).map(function(c){ return c.name; });
    var pattern = names.map(escapeRegExp).join('|');
    if (!pattern){ container.appendChild(document.createTextNode(rawText)); return; }
    var re = new RegExp('\\b(' + pattern + ')\\b', 'gi');
    var lastIndex = 0;
    var match;
    while ((match = re.exec(rawText))){
      if (match.index > lastIndex) container.appendChild(document.createTextNode(rawText.slice(lastIndex, match.index)));
      var matchedName = match[0];
      var contact = contacts.find(function(c){ return c.name.toLowerCase() === matchedName.toLowerCase(); });
      var a = document.createElement('a');
      a.href = 'tel:' + contact.phone;
      a.className = 'contact-call-link';

      var icon = document.createElement('i');

      lastIndex = re.lastIndex;
    }

  }

  // ---------- Parsing (bilingual, independent of UI language) ----------
  function extractRelativeTime(text){
    var m = text.match(/\b(?:en|in)\s+(\d{1,3})\s*(minutos?|mins?|horas?|hrs?|hours?|minutes?|dias?|d[ií]as?|days?|semanas?|weeks?)\b/i);
    if (!m) return null;
    var qty = parseInt(m[1], 10);
    var unit = m[2].toLowerCase();
    var target = new Date();
    if (unit.indexOf('h') === 0){
      target.setHours(target.getHours() + qty);
    } else if (unit.indexOf('semana') === 0 || unit.indexOf('week') === 0){
      target.setDate(target.getDate() + qty * 7);
    } else if (unit.indexOf('dia') === 0 || unit.indexOf('día') === 0 || unit.indexOf('day') === 0){
      target.setDate(target.getDate() + qty);
    } else {
      target.setMinutes(target.getMinutes() + qty);
    }
    return { match: m[0], target: target };
  }
  function extractSpecificDate(text){
    var reThisMonth = /\b(\d{1,2})\s*de\s*este\s*mes\b/i;
    var m0 = reThisMonth.exec(text);
    if (m0){
      var day0 = parseInt(m0[1], 10);
      if (day0 >= 1 && day0 <= 31) return { match: m0[0], day: day0, month: new Date().getMonth(), year: null };
    }
    var re = /\b(\d{1,2})\s*(?:de|of)?\s*([a-záéíóúñA-Z]+)(?:\s*(?:de|,)?\s*(\d{4}))?\b/gi;
    var m;
    while ((m = re.exec(text))){
      var day = parseInt(m[1], 10);
      if (day < 1 || day > 31) continue;
      var word = m[2].toLowerCase();
      var monthIdx = -1;
      for (var mi = 0; mi < 12; mi++){
        var baseEs = monthNamesEs[mi].toLowerCase();
        var baseEn = monthNamesEn[mi].toLowerCase();
        if (word[0] === baseEs[0] && levenshtein(word, baseEs) <= 1){ monthIdx = mi; break; }
        if (word[0] === baseEn[0] && levenshtein(word, baseEn) <= 1){ monthIdx = mi; break; }
      }
      if (monthIdx === -1) continue;
      var year = m[3] ? parseInt(m[3], 10) : null;
      return { match: m[0], day: day, month: monthIdx, year: year };
    }
    return null;
  }
  function extractBareDayOfMonth(text){
    var m = text.match(/\bon\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\b/i);
    if (m){ var d1 = parseInt(m[1], 10); if (d1 >= 1 && d1 <= 31) return { match: m[0], day: d1 }; }
    m = text.match(/\bel\s+(\d{1,2})\b(?!\s*de)/i);
    if (m){ var d2 = parseInt(m[1], 10); if (d2 >= 1 && d2 <= 31) return { match: m[0], day: d2 }; }
    m = text.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i);
    if (m){ var d3 = parseInt(m[1], 10); if (d3 >= 1 && d3 <= 31) return { match: m[0], day: d3 }; }
    return null;
  }
  function resolveBareDay(day){
    var now = new Date();
    var candidate = new Date(now.getFullYear(), now.getMonth(), day);
    var todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (candidate < todayOnly) candidate.setMonth(candidate.getMonth() + 1);
    return candidate;
  }
  function extractWeekdayRange(text){
    var names = Object.keys(dayWords).join('|');
    var m = text.match(new RegExp('\\bde\\s+(' + names + ')\\s+a\\s+(' + names + ')\\b', 'i'));
    if (!m) m = text.match(new RegExp('\\b(' + names + ')\\s+to\\s+(' + names + ')\\b', 'i'));
    if (!m) return null;
    var start = dayWords[m[1].toLowerCase()];
    var end = dayWords[m[2].toLowerCase()];
    if (start == null || end == null) return null;
    var days = [];
    var i = start;
    for (var c = 0; c < 7; c++){
      days.push(i);
      if (i === end) break;
      i = (i + 1) % 7;
    }
    return { match: m[0], days: days };
  }

  function extractRecurringExact(text){
    var range = extractWeekdayRange(text);
    if (range) return { type: 'weekly', weekdays: range.days, match: range.match };
    var m = text.match(/todos\s+los\s+d[ií]as/i) || text.match(/\bevery\s*day\b/i);
    if (m) return { type: 'daily', match: m[0] };
    for (var name in dayWords){
      var re = new RegExp('todos\\s+los\\s+' + name + 's?\\b', 'i');
      var found = text.match(re);
      if (found) return { type: 'weekly', weekdays: [dayWords[name]], match: found[0] };
      var re2 = new RegExp('\\bevery\\s+' + name + 's?\\b', 'i');
      var found2 = text.match(re2);
      if (found2) return { type: 'weekly', weekdays: [dayWords[name]], match: found2[0] };
    }
    return null;
  }
  function fuzzyRecurringMatch(text){
    var tokens = [];
    var re = /[a-záéíóúñA-Z]+/gi, m;
    while ((m = re.exec(text))) tokens.push({ w: m[0], i: m.index });
    for (var i = 0; i < tokens.length - 2; i++){
      var w0 = tokens[i].w.toLowerCase();
      var w1 = tokens[i+1].w.toLowerCase();
      var w2raw = tokens[i+2].w;
      var w2 = w2raw.toLowerCase().replace(/s$/, '');
      if (w0[0] === 't' && w1[0] === 'l' && levenshtein(w0, 'todos') <= 1 && levenshtein(w1, 'los') <= 1){
        if (levenshtein(w2, 'dia') <= 1) return { type: 'daily', match: text.slice(tokens[i].i, tokens[i+2].i + w2raw.length) };
        for (var name in dayWords){
          var base = name.replace(/s$/, '');
          if (base.length >= 4 && w2[0] === base[0] && levenshtein(w2, base) <= 1){
            return { type: 'weekly', weekdays: [dayWords[name]], match: text.slice(tokens[i].i, tokens[i+2].i + w2raw.length) };
          }
        }
      }
    }
    return null;
  }
  function extractRecurring(text){ return extractRecurringExact(text) || fuzzyRecurringMatch(text); }
  function extractTime(text){
    var m = text.match(/(\d{1,2}):(\d{2})\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/i);
    if (m) return { match: m[0], h: parseInt(m[1],10), mnt: parseInt(m[2],10), mer: m[3] ? m[3].replace(/[.\s]/g,'').toLowerCase() : null };
    m = text.match(/\b(\d{1,2})\s*(a\.?\s?m\.?|p\.?\s?m\.?)\b/i);
    if (m) return { match: m[0], h: parseInt(m[1],10), mnt: 0, mer: m[2].replace(/[.\s]/g,'').toLowerCase() };
    m = text.match(/a\s*las\s*(\d{3,4})\b/i);
    if (m){
      var d = m[1];
      var h = d.length === 3 ? parseInt(d.slice(0,1),10) : parseInt(d.slice(0,2),10);
      var mnt = d.length === 3 ? parseInt(d.slice(1),10) : parseInt(d.slice(2),10);
      return { match: m[0], h: h, mnt: mnt, mer: null };
    }
    m = text.match(/(?:a\s*las|\bat)\s*(\d{1,2})\b/i);
    if (m) return { match: m[0], h: parseInt(m[1],10), mnt: 0, mer: null };
    return null;
  }
  function extractDayExact(text){
    var low = text.toLowerCase();
    if (/\bhoy\b|\btoday\b/.test(low)) return { type: 'today', match: low.match(/\bhoy\b|\btoday\b/)[0] };
    var mm = low.match(/\bma[nñ]ana\b|\btomorrow\b/);
    if (mm) return { type: 'tomorrow', match: mm[0] };
    for (var name in dayWords){
      var re = new RegExp('\\b' + name + '\\b', 'i');
      var found = text.match(re);
      if (found) return { type: 'weekday', weekday: dayWords[name], match: found[0] };
    }
    return null;
  }
  function fuzzyDayMatch(text){
    var tokens = text.match(/[a-záéíóúñA-Z]+/gi) || [];
    for (var i = 0; i < tokens.length; i++){
      var raw = tokens[i];
      var wNorm = raw.toLowerCase().replace('ñ', 'n');
      if (wNorm[0] === 'm' && levenshtein(wNorm, 'manana') <= 1) return { type: 'tomorrow', match: raw };
      if (wNorm[0] === 't' && levenshtein(wNorm, 'tomorrow') <= 1) return { type: 'tomorrow', match: raw };
      var w = raw.toLowerCase().replace(/s$/, '');
      for (var name in dayWords){
        var base = name.replace(/s$/, '');
        if (base.length >= 4 && w[0] === base[0] && levenshtein(w, base) <= 1) return { type: 'weekday', weekday: dayWords[name], match: raw };
      }
    }
    return null;
  }
  function extractDay(text){ return extractDayExact(text) || fuzzyDayMatch(text); }
  function normalizeHour(h, mnt, mer){
    if (mer === 'pm' && h < 12) h += 12;
    if (mer === 'am' && h === 12) h = 0;
    if (h === 24) h = 0;
    if (h < 0 || h > 23 || mnt < 0 || mnt > 59) return null;
    return { h: h, mnt: mnt };
  }
  function resolveTarget(h, mnt, dayInfo){
    var now = new Date();
    var target = new Date(now);
    target.setHours(h, mnt, 0, 0);
    if (dayInfo){
      if (dayInfo.type === 'tomorrow') target.setDate(target.getDate() + 1);
      else if (dayInfo.type === 'weekday'){
        var diff = (dayInfo.weekday - now.getDay() + 7) % 7;
        if (diff === 0 && target <= now) diff = 7;
        target.setDate(now.getDate() + diff);
      }
    } else {
      if (target <= now) target.setDate(target.getDate() + 1);
    }
    return target;
  }
  function resolveDayOnly(dayInfo){

    if (dayInfo.type === 'tomorrow'){ var d = new Date(todayOnly); d.setDate(d.getDate() + 1); return d; }
    if (dayInfo.type === 'today') return todayOnly;
    if (dayInfo.type === 'weekday'){
      var diff = (dayInfo.weekday - now.getDay() + 7) % 7;
      if (diff === 0) diff = 7;
      var d2 = new Date(todayOnly); d2.setDate(d2.getDate() + diff); return d2;

  function relativeDayLabel(target){

    var diffDays = Math.round((t1 - t0) / 86400000);

  function playBeep(freq){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';

      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

  function nextOccurrence(note){

      var t = new Date(now); t.setHours(note.hour, note.minute, 0, 0);
      if (t <= now) t.setDate(t.getDate() + 1);
      return t;
    }
    if (note.recurring.type === 'weekly'){
      var wds = note.recurring.weekdays;
      var best = null;
      for (var wi = 0; wi < wds.length; wi++){
        var t2 = new Date(now); t2.setHours(note.hour, note.minute, 0, 0);
        var diff = (wds[wi] - now.getDay() + 7) % 7;
        if (diff === 0 && t2 <= now) diff = 7;
        t2.setDate(now.getDate() + diff);
        if (!best || t2 < best) best = t2;
      }
      return best;
    }
    if (note.recurring.type === 'yearly'){
      var t3 = new Date(now.getFullYear(), note.recurring.month, note.recurring.day, note.hour, note.minute, 0, 0);
      if (t3 <= now) t3 = new Date(now.getFullYear() + 1, note.recurring.month, note.recurring.day, note.hour, note.minute, 0, 0);
      return t3;
    }
    return null;
  }
  function renderNextAlarm(){
    var upcoming = notes.map(function(n){ return { n: n, t: nextOccurrence(n) }; }).filter(function(x){ return x.t; });
    upcoming.sort(function(a, b){ return a.t - b.t; });
    if (!upcoming.length){ nextAlarmEl.textContent = t('nextAlarmNone'); return; }
    var top = upcoming[0];
    nextAlarmEl.innerHTML = '<strong>' + relativeDayLabel(top.t) + ' ' + formatHM(top.t) + '</strong><br>' + top.n.raw;
  }

  function parseNoteInput(raw){
    var relInfo = extractRelativeTime(raw);
    var specificDateInfo = relInfo ? null : extractSpecificDate(raw);
    var bareDayInfo = (relInfo || specificDateInfo) ? null : extractBareDayOfMonth(raw);
    var recurInfo = (relInfo || specificDateInfo || bareDayInfo) ? null : extractRecurring(raw);
    var dayInfo = (relInfo || specificDateInfo || bareDayInfo || recurInfo) ? null : extractDay(raw);
    var timeInfoRaw = extractTime(raw);
    var hour = null, minute = null, target = null, recurring = null, dateOnly = null;

    if (relInfo){
      target = relInfo.target;
      if (timeInfoRaw){
        var relNorm = normalizeHour(timeInfoRaw.h, timeInfoRaw.mnt, timeInfoRaw.mer);
        if (relNorm) target.setHours(relNorm.h, relNorm.mnt, 0, 0);
      }
      hour = target.getHours(); minute = target.getMinutes();
      return { text: raw, hour: hour, minute: minute, target: target, recurring: null, dateOnly: null };
    }
    if (timeInfoRaw){
      var norm = normalizeHour(timeInfoRaw.h, timeInfoRaw.mnt, timeInfoRaw.mer);
      if (norm){ hour = norm.h; minute = norm.mnt; }
    }
    if (specificDateInfo){
      if (specificDateInfo.year != null){
        var dateObj = new Date(specificDateInfo.year, specificDateInfo.month, specificDateInfo.day);
        if (hour != null){ target = new Date(dateObj); target.setHours(hour, minute, 0, 0); }
        else dateOnly = dateObj;
      } else {
        recurring = { type: 'yearly', month: specificDateInfo.month, day: specificDateInfo.day };
      }
    } else if (bareDayInfo){
      var bareDate = resolveBareDay(bareDayInfo.day);
      if (hour != null){ target = new Date(bareDate); target.setHours(hour, minute, 0, 0); }
      else dateOnly = bareDate;
    } else if (hour != null){
      if (recurInfo){
        recurring = recurInfo.type === 'daily' ? { type: 'daily' } : { type: 'weekly', weekdays: recurInfo.weekdays };
      } else if (dayInfo){
        var resolved = resolveDayOnly(dayInfo);
        target = new Date(resolved); target.setHours(hour, minute, 0, 0);
      } else {
        target = resolveTarget(hour, minute, null);
      }
    } else if (recurInfo){
      recurring = recurInfo.type === 'daily' ? { type: 'daily' } : { type: 'weekly', weekdays: recurInfo.weekdays };
    } else if (dayInfo){
      dateOnly = resolveDayOnly(dayInfo);
    }
    return { text: raw, hour: hour, minute: minute, target: target, recurring: recurring, dateOnly: dateOnly };
  }

  function flashSaved(){
    savedFlash.style.opacity = '1';
    setTimeout(function(){ savedFlash.style.opacity = '0'; }, 1200);
  }
  function loadForEdit(note){
    editingId = note.id;
    noteInput.value = note.raw;
    noteInput.focus();
    addBtn.style.display = 'inline-block';
    addBtn.textContent = t('saveChanges');
    cancelEditBtn.style.display = 'inline';
    vibrate(10);
  }
  function exitEditMode(){
    editingId = null; noteInput.value = ''; addBtn.style.display = 'none'; cancelEditBtn.style.display = 'none';
  }
  cancelEditBtn.addEventListener('click', exitEditMode);

  function renderNotes(){
    listEl.innerHTML = '';
    var ordered = notes.slice().reverse();
    if (searchTerm){
      ordered = ordered.filter(function(n){ return n.raw.toLowerCase().indexOf(searchTerm) !== -1; });
    }
    emptyMsg.style.display = ordered.length ? 'none' : 'block';
    emptyMsg.textContent = searchTerm ? t('noMatches') : t('empty');
    ordered.forEach(function(note, idx){
      var block = document.createElement('div');
      block.className = 'note-block' + (note.hour != null && !note.enabled ? ' disabled' : '');

      var numSpan = document.createElement('span');
      numSpan.className = 'note-number';
      numSpan.textContent = (idx + 1) + '.';
      block.appendChild(numSpan);

      var textEl = document.createElement('span');
      renderNoteText(textEl, note.raw);
      block.appendChild(textEl);

      var actions = document.createElement('div');
      actions.className = 'note-block-actions';

      var hasAlarmCapability = note.hour != null || (note.recurring && note.recurring.type === 'yearly');
      if (hasAlarmCapability){
        var bellBtn = document.createElement('button');
        bellBtn.className = 'icon-btn ' + (note.enabled ? 'bell-on' : 'bell-off');
        bellBtn.innerHTML = '<i class="ti ' + (note.enabled ? 'ti-bell' : 'ti-bell-off') + '" aria-hidden="true"></i>';
        bellBtn.setAttribute('aria-label', note.enabled ? 'Alarm off' : 'Alarm on');
        bellBtn.addEventListener('click', function(){
          note.enabled = !note.enabled; note.firedKey = null; vibrate(8); renderAll();
        });
        actions.appendChild(bellBtn);
      }

      var editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.innerHTML = '<i class="ti ti-pencil" aria-hidden="true"></i>';
      editBtn.setAttribute('aria-label', 'Edit');
      editBtn.addEventListener('click', function(){ loadForEdit(note); });
      actions.appendChild(editBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.innerHTML = '<i class="ti ti-trash" aria-hidden="true"></i>';
      delBtn.setAttribute('aria-label', 'Delete');
      delBtn.addEventListener('click', function(){
        vibrate([8,30,8]);
        notes = notes.filter(function(n){ return n.id !== note.id; });
        if (editingId === note.id) exitEditMode();
        renderAll();
      });
      actions.appendChild(delBtn);

      block.appendChild(actions);
      listEl.appendChild(block);
    });
  }

  function renderCalendar(){
    calTitle.textContent = t('months')[calState.month] + ' ' + calState.year;
    calWeekdays.innerHTML = '';
    t('daysShort').forEach(function(w){
      var el = document.createElement('div'); el.className = 'cal-wd'; el.textContent = w;
      calWeekdays.appendChild(el);
    });
    calGrid.innerHTML = '';
    var firstDay = new Date(calState.year, calState.month, 1);
    var startOffset = firstDay.getDay();
    var daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
    for (var i = 0; i < startOffset; i++){
      var blank = document.createElement('div'); blank.className = 'cal-cell empty'; calGrid.appendChild(blank);
    }
    for (var day = 1; day <= daysInMonth; day++){
      var cellDate = new Date(calState.year, calState.month, day);
      var key = dateKey(cellDate);
      var cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (key === dateKey(today)) cell.classList.add('today');
      if (key === selectedDateKey) cell.classList.add('selected');
      var dayNotes = notesForDate(cellDate);
      var icon = dayNotes.length ? dayActivityIcon(dayNotes) : null;
      if (dayNotes.length) cell.classList.add('has-activity');
      if (icon){
        var iconEl = document.createElement('i');
        iconEl.className = 'ti ' + icon + ' cal-activity-icon';
        iconEl.setAttribute('aria-hidden', 'true');
        cell.appendChild(iconEl);
      } else {
        var num = document.createElement('div'); num.className = 'cal-daynum'; num.textContent = day;
        cell.appendChild(num);
      }
      if (dayNotes.length > 1){
        var countEl = document.createElement('div'); countEl.className = 'cal-count'; countEl.textContent = dayNotes.length;
        cell.appendChild(countEl);
      }
      cell.addEventListener('click', function(k){
        return function(){
          vibrate(6);
          selectedDateKey = (selectedDateKey === k) ? null : k;
          renderCalendar(); renderSelectedPanel();
        };
      }(key));
      calGrid.appendChild(cell);
    }
  }

  function notesForDate(d){
    return notes.filter(function(n){
      if (n.dateOnly && dateKey(n.dateOnly) === dateKey(d)) return true;
      if (n.recurring){
        if (n.recurring.type === 'daily') return true;
        if (n.recurring.type === 'weekly') return n.recurring.weekdays.indexOf(d.getDay()) !== -1;
        if (n.recurring.type === 'yearly') return n.recurring.month === d.getMonth() && n.recurring.day === d.getDate();
      }
      if (n.hour == null) return false;
      return dateKey(n.target) === dateKey(d);
    });
  }

  function renderSelectedPanel(){
    if (!selectedDateKey){ calSelectedPanel.style.display = 'none'; return; }
    var parts = selectedDateKey.split('-');
    var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    var dayNotes = notesForDate(d);
    calSelectedPanel.style.display = 'block';
    calSelectedTitle.textContent = t('days')[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
    calSelectedNotes.innerHTML = '';
    if (!dayNotes.length){
      var none = document.createElement('div'); none.className = 'cal-mini-note'; none.textContent = t('noNotesDay');
      calSelectedNotes.appendChild(none); return;
    }
    dayNotes.forEach(function(n){
      var el = document.createElement('div'); el.className = 'cal-mini-note';
      renderNoteText(el, n.raw);
      calSelectedNotes.appendChild(el);
    });
  }

  function renderAll(){
    renderNotes(); renderCalendar(); renderSelectedPanel(); renderNextAlarm(); saveToStorage();
  }

  calPrev.addEventListener('click', function(){ vibrate(6); calState.month--; if (calState.month < 0){ calState.month = 11; calState.year--; } renderCalendar(); });
  calNext.addEventListener('click', function(){ vibrate(6); calState.month++; if (calState.month > 11){ calState.month = 0; calState.year++; } renderCalendar(); });

  function addNewNoteFromRaw(raw){
    raw = capitalizeFirst(raw);
    var parsed = parseNoteInput(raw);
    var createdAt = new Date();
    var hasDateInfo = parsed.hour != null || parsed.dateOnly || parsed.recurring;
    var recurring = parsed.recurring;
    if (!hasDateInfo) recurring = { type: 'yearly', month: createdAt.getMonth(), day: createdAt.getDate() };
    notes.push({
      id: idCounter++, raw: raw, hour: parsed.hour, minute: parsed.minute, target: parsed.target,
      recurring: recurring, dateOnly: parsed.dateOnly, createdAt: createdAt, enabled: true, firedKey: null
    });
    var focusDate = parsed.target || parsed.dateOnly;
    if (focusDate){ calState.year = focusDate.getFullYear(); calState.month = focusDate.getMonth(); selectedDateKey = dateKey(focusDate); }
    else if (recurring && recurring.type === 'yearly'){ calState.month = recurring.month; selectedDateKey = calState.year + '-' + (recurring.month+1) + '-' + recurring.day; }
  }

  function saveEditedNote(raw){
    raw = capitalizeFirst(raw);
    var idx = notes.findIndex(function(n){ return n.id === editingId; });
    if (idx !== -1){
      var parsed = parseNoteInput(raw);
      var hasDateInfo = parsed.hour != null || parsed.dateOnly || parsed.recurring;
      notes[idx].raw = raw; notes[idx].hour = parsed.hour; notes[idx].minute = parsed.minute;
      notes[idx].target = parsed.target; notes[idx].dateOnly = parsed.dateOnly; notes[idx].firedKey = null;
      if (hasDateInfo) notes[idx].recurring = parsed.recurring;
      else if (!notes[idx].recurring || notes[idx].recurring.type !== 'yearly')
        notes[idx].recurring = { type: 'yearly', month: notes[idx].createdAt.getMonth(), day: notes[idx].createdAt.getDate() };
    }
  }

  noteInput.addEventListener('input', function(){
    if (editingId != null) return;
    var value = noteInput.value;
    if (!/\n\s*\n/.test(value)) return;
    var parts = value.split(/\n\s*\n+/);
    var remaining = parts.pop();
    var completed = parts.map(function(p){ return p.trim(); }).filter(Boolean);
    if (!completed.length) return;
    completed.forEach(function(p){ addNewNoteFromRaw(p); });
    noteInput.value = remaining;
    vibrate(20); flashSaved(); renderAll();
  });
  noteInput.addEventListener('blur', function(){
    if (recording) return;
    var value = noteInput.value.trim();
    if (!value) return;
    if (editingId != null){ saveEditedNote(value); exitEditMode(); }
    else {
      value.split(/\n\s*\n+/).map(function(p){ return p.trim(); }).filter(Boolean).forEach(function(p){ addNewNoteFromRaw(p); });
      noteInput.value = '';
    }
    vibrate(20); flashSaved(); renderAll();
  });
  addBtn.addEventListener('click', function(){
    var raw = noteInput.value.trim();
    if (!raw || editingId == null) return;
    saveEditedNote(raw); exitEditMode(); vibrate(20); flashSaved(); renderAll();
  });

  function startRinging(note){
    currentRinging = note;
    var typeKey = noteTypeKey(note);
    ringingLabel.textContent = '\u23F0 ' + note.raw;
    ringingSub.textContent = note.recurring ? '' : t('ringingSub');
    ringingBanner.style.display = 'block';
    ringingBanner.classList.add('active');
    playBeep(typeFreq[typeKey]);
    vibrate([200,100,200,100,200]);
    sendSystemNotification(note);
    ringLoop = setInterval(function(){ playBeep(typeFreq[typeKey]); }, 700);
  }
  function stopRinging(){
    ringingBanner.style.display = 'none';
    ringingBanner.classList.remove('active');
    if (ringLoop) clearInterval(ringLoop);
    currentRinging = null;
    if (ringQueue.length){ var next = ringQueue.shift(); setTimeout(function(){ startRinging(next); }, 400); }
  }
  dismissBtn.addEventListener('click', function(){
    vibrate(10);
    if (currentRinging) currentRinging.enabled = false;
    stopRinging(); renderAll();
  });
  remindLaterBtn.addEventListener('click', function(){
    vibrate(10);
    if (currentRinging && !currentRinging.recurring && currentRinging.hour != null){
      var t2 = new Date(); t2.setMinutes(t2.getMinutes() + REMIND_AGAIN_MINUTES);
      currentRinging.target = t2; currentRinging.hour = t2.getHours(); currentRinging.minute = t2.getMinutes(); currentRinging.firedKey = null;
    }
    stopRinging(); renderAll();
  });
  snoozeBtn.addEventListener('click', function(){
    vibrate(10);
    if (currentRinging && !currentRinging.recurring){
      var t3 = new Date(); t3.setMinutes(t3.getMinutes() + 5);
      currentRinging.target = t3; currentRinging.hour = t3.getHours(); currentRinging.minute = t3.getMinutes(); currentRinging.firedKey = null;
    }
    stopRinging(); renderAll();
  });

  setInterval(function(){
    var now = new Date();
    var todayKey = dateKey(now);
    notes.forEach(function(note){
      if (note.hour == null || !note.enabled) return;
      if (note === currentRinging) return;
      if (ringQueue.indexOf(note) !== -1) return;
      var minuteMatches = now.getHours() === note.hour && now.getMinutes() === note.minute;
      var dayMatches = false;
      if (note.recurring){
        if (note.recurring.type === 'daily') dayMatches = true;
        else if (note.recurring.type === 'weekly') dayMatches = note.recurring.weekdays.indexOf(now.getDay()) !== -1;
        else if (note.recurring.type === 'yearly') dayMatches = note.recurring.month === now.getMonth() && note.recurring.day === now.getDate();
      } else {
        dayMatches = dateKey(note.target) === todayKey;
      }
      if (minuteMatches && dayMatches && note.firedKey !== todayKey){
        note.firedKey = todayKey;
        if (currentRinging) ringQueue.push(note); else startRinging(note);
      }
    });
    renderNextAlarm();
  }, 1000);

  // ---------- Init ----------
  loadFromStorage();
  loadContacts();
  applyLanguage();
  renderAll();

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
    navigator.serviceWorker.addEventListener('message', function(event){
      var data = event.data;
      if (!data || data.type !== 'notif-action') return;
      var idMatch = /alarm-(\d+)/.exec(data.tag || '');
      if (!idMatch) return;
      var id = parseInt(idMatch[1], 10);
      var note = notes.find(function(n){ return n.id === id; });
      if (!note) return;
      if (data.action === 'snooze5'){
        if (!note.recurring){
          var ts = new Date(); ts.setMinutes(ts.getMinutes() + 5);
          note.target = ts; note.hour = ts.getHours(); note.minute = ts.getMinutes(); note.firedKey = null;
        }
      } else if (data.action === 'remind15'){
        if (!note.recurring && note.hour != null){
          var tr = new Date(); tr.setMinutes(tr.getMinutes() + REMIND_AGAIN_MINUTES);
          note.target = tr; note.hour = tr.getHours(); note.minute = tr.getMinutes(); note.firedKey = null;
        }
      } else {
        note.enabled = false;
      }
      if (currentRinging === note) stopRinging();
      renderAll();
    });
  }

  // ---------- Export / Import ----------
  var exportBtn = document.getElementById('export-btn');
  var importBtn = document.getElementById('import-btn');
  var importFileInput = document.getElementById('import-file-input');

  exportBtn.addEventListener('click', function(){
    var data = JSON.stringify(serializeNotes(), null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'mi-alarma-backup-' + dateKey(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    vibrate(10);
  });

  importBtn.addEventListener('click', function(){ importFileInput.click(); });
  importFileInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var arr = JSON.parse(ev.target.result);
        arr.forEach(function(n){
          notes.push({
            id: idCounter++,
            raw: n.raw,
            hour: n.hour,
            minute: n.minute,
            target: n.target ? new Date(n.target) : null,
            dateOnly: n.dateOnly ? new Date(n.dateOnly) : null,
            recurring: n.recurring,
            createdAt: n.createdAt ? new Date(n.createdAt) : new Date(),
            enabled: n.enabled !== false,
            firedKey: null
          });
        });
        renderAll();
        flashSaved();
        vibrate(20);
      } catch(err){
        alert(currentLang === 'en' ? 'Invalid backup file.' : 'Archivo de respaldo invalido.');
      }
    };
    reader.readAsText(file);
    importFileInput.value = '';
  });

  // ---------- Search ----------
  var searchTerm = '';
  searchInput.addEventListener('input', function(){
    searchTerm = searchInput.value.trim().toLowerCase();
    renderNotes();
  });
})();
</script>
