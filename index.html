// Shows a resizable QR sticker (business link + name) in a full-screen overlay —
// used both right after creating a new client (hand the phone to them to scan, or
// share the link, on the spot) and from "Print QR sticker" in All Clients. Printing
// is scoped via the @media print rule in <style> (hides everything else) instead of
// window.open() — a same-page print never hits a popup blocker, which matters since
// this needs to work the same way on a phone as it does at the store's desktop.
let qrStickerDataUrl = null, qrStickerName = '';
function printClientQr(slug, name) {
  qrStickerDataUrl = null;
  qrStickerName = name;
  let ov = document.getElementById('qrPrintOverlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'qrPrintOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,18,15,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;';
    document.body.appendChild(ov);
  }
  const canShare = !!navigator.share;
  ov.innerHTML = `
    <div style="background:#fff;border-radius:10px;padding:24px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 48px rgba(0,0,0,0.6);max-height:92vh;overflow:auto;">
      <div id="qrStickerArea" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Arial,sans-serif;">
        <div style="font-size:13px;color:#888;">Generating QR…</div>
      </div>
      <div class="qr-size-picker" style="margin-top:16px;text-align:center;">
        <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">Sticker size</div>
        <div id="qrSizeBtns" style="display:flex;gap:6px;justify-content:center;"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;">
        <button class="btn-primary" style="padding:8px 16px;width:auto;" onclick="window.print()">🖨️ Print</button>
        ${canShare ? `<button class="btn-secondary" style="padding:8px 16px;width:auto;margin-top:0;" onclick="shareClientQr('${slug.replace(/'/g,"\\'")}')">📤 Share link</button>` : ''}
        <button class="btn-secondary" style="padding:8px 16px;width:auto;margin-top:0;" onclick="document.getElementById('qrPrintOverlay').remove()">✕ Close</button>
      </div>
    </div>
  `;
  const sizes = [2, 3, 4, 6];
  document.getElementById('qrSizeBtns').innerHTML = sizes.map(n => `
    <button data-size="${n}" onclick="setQrStickerSize(${n})" style="width:auto;padding:6px 12px;font-size:12.5px;border-radius:8px;border:1px solid var(--steel);background:${n===4?'var(--steel)':'transparent'};color:${n===4?'#fff':'var(--steel)'};cursor:pointer;">${n}"</button>
  `).join('');
  const area = document.getElementById('qrStickerArea');
  if (typeof QRCode === 'undefined') {
    area.innerHTML = `<div style="font-size:13px;color:#888;">The QR library didn't load (check your internet connection) — try again.</div>`;
    return;
  }
  const url = window.location.origin + '/' + slug;
  // Rendered off-screen at a fixed 900x900, then grabbed as a PNG data URL —
  // QRCode.js draws into a real DOM node, it doesn't hand back a string, so this
  // throwaway container is just how we capture it. One fixed-resolution render is
  // reused at every sticker size (setQrStickerSize just rescales the <img> via CSS),
  // no need to regenerate the QR itself when the size picker changes.
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
  document.body.appendChild(holder);
  new QRCode(holder, { text: url, width: 900, height: 900, correctLevel: QRCode.CorrectLevel.M });
  setTimeout(() => {
    const canvas = holder.querySelector('canvas');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
    document.body.removeChild(holder);
    if (!document.getElementById('qrStickerArea')) return;
    if (!dataUrl) { area.innerHTML = `<div style="font-size:13px;color:#888;">Could not generate the QR code.</div>`; return; }
    qrStickerDataUrl = dataUrl;
    setQrStickerSize(4);
  }, 80);
}
// Redraws the sticker at the given inch size (img ~75% of the box, name/caption
// scaled proportionally) and updates the @page size used by the browser's print
// dialog, so "Print" always matches whatever size is currently selected on screen.
function setQrStickerSize(inches) {
  const area = document.getElementById('qrStickerArea');
  if (!area || !qrStickerDataUrl) return;
  const imgIn = inches * 0.75;
  area.style.width = inches + 'in';
  area.style.height = inches + 'in';
  area.innerHTML = `
    <img src="${qrStickerDataUrl}" alt="QR code" style="width:${imgIn}in;height:${imgIn}in;image-rendering:pixelated;">
    <div style="font-size:${(inches*3.75).toFixed(1)}pt;font-weight:700;margin-top:0.15in;line-height:1.2;">${escapeHtml(qrStickerName)}</div>
    <div style="font-size:${(inches*2.25).toFixed(1)}pt;color:#555;margin-top:0.05in;letter-spacing:0.02em;text-transform:uppercase;">Scan to order — SC</div>
  `;
  document.querySelectorAll('#qrSizeBtns button').forEach(b => {
    const active = Number(b.dataset.size) === inches;
    b.style.background = active ? 'var(--steel)' : 'transparent';
    b.style.color = active ? '#fff' : 'var(--steel)';
  });
  let pageStyle = document.getElementById('qrPageSizeStyle');
  if (!pageStyle) {
    pageStyle = document.createElement('style');
    pageStyle.id = 'qrPageSizeStyle';
    document.head.appendChild(pageStyle);
  }
  pageStyle.textContent = `@media print { @page { size: ${inches}in ${inches}in; margin: 0; } }`;
}

// Computes a 0-100 priority score for a prospect using real signals we actually have:
// status (interested/new/contacted/not-interested), a manual priority tag Sergio sets,
// and staleness (days since added / since last contact). No fabricated data.
function scoreProspect(p) {
  const status = p.status || 'new';
  const priority = p.priority || 'medium';
  const now = Date.now();
  const added = p.addedDate || now;
  const daysSinceAdded = Math.floor((now - added) / 86400000);
  const daysSinceContact = p.lastContactDate ? Math.floor((now - p.lastContactDate) / 86400000) : null;

  let score = 0;
  // Status signal
  score += { interested: 40, new: 25, contacted: 15, not_interested: 0 }[status] ?? 25;
  // Manual priority signal (Sergio's own knowledge of the zone/customer)
  score += { high: 25, medium: 12, low: 0 }[priority] ?? 12;
  // Staleness signals — don't let leads go cold or fall through the cracks
  if (status === 'new' && daysSinceAdded > 7) score += 15;
  else if (status === 'new' && daysSinceAdded <= 2) score += 10;
  if (status === 'contacted' && daysSinceContact !== null && daysSinceContact > 14) score += 20;

  return Math.max(0, Math.min(100, score));
}
function priorityBadge(score) {
  if (score >= 60) return { label: 'High', emoji: '🔴' };
  if (score >= 35) return { label: 'Medium', emoji: '🟡' };
  return { label: 'Low', emoji: '🟢' };
}

// Reads the selected image, downscales it client-side (canvas) to keep the file small,
// and stores the resulting base64 JPEG on state until the promo is saved.
function handlePromoFileSelect(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 900;
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      state.newPromoImage = canvas.toDataURL('image/jpeg', 0.8);
      const wrap = document.getElementById('newPromoPreviewWrap');
      if (wrap) wrap.innerHTML = `<img src="${state.newPromoImage}" style="width:100%;border-radius:6px;margin-top:6px;">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Prospects can have an explicit "zone" (from Sergio's real Gulf Coast zone list).
// Falls back to guessing from the address only if no explicit zone was set.
function extractZone(p) {
  if (p.zone) return p.zone;
  const address = p.address;
  if (!address) return 'Unknown';
  const parts = address.split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length >= 2) return parts[parts.length - 2];
  return parts[0] || 'Unknown';
}
function renderStoreProspects() {

  const industryFilter = state.prospectIndustryFilter || 'all';
  let list = Object.values(state.data.prospects || {});
  if (rep) {
    // Legacy prospects with no repId assigned yet belong to Sergio (who originally imported them).
    list = list.filter(p => p.repId ? p.repId === rep.id : rep.id === 'rep_sergio');
  }

  // Build the dropdown option lists from whatever zones/industries actually exist right now.
  const allZones = [...new Set(list.map(p => extractZone(p)))].sort();
  const allIndustries = [...new Set(list.map(p => p.category || 'Uncategorized'))].sort();

  if (zoneFilter !== 'all') list = list.filter(p => extractZone(p) === zoneFilter);
  if (industryFilter !== 'all') list = list.filter(p => (p.category || 'Uncategorized') === industryFilter);
  if (search) list = list.filter(p => p.name.toLowerCase().includes(search) || (p.category||'').toLowerCase().includes(search));
  list.sort((a,b) => scoreProspect(b) - scoreProspect(a));

  const rowHtml = (p) => {
    const open = state.expandedProspectId === p.id;
    const score = scoreProspect(p);
    const badge = priorityBadge(score);
    const status = p.status || 'new';
    return `
    <div class="card" style="margin-bottom:8px;padding:0;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;" onclick="toggleProspectExpand('${p.id}')">
        <div style="min-width:0;">
          <div style="font-weight:700;font-size:15px;">${badge.emoji} ${escapeHtml(p.name)}</div>
          <div style="font-size:12px;color:var(--ink);">${p.category || ''}${p.category ? ' · ' : ''}${extractZone(p)} · ${badge.label} priority</div>
        </div>
        <div class="arrow" style="transform:rotate(${open ? '90deg' : '0deg'});transition:transform .15s;flex-shrink:0;margin-left:8px;">→</div>
      </div>
      ${open ? `
        <div style="padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px;">
          ${p.address ? `<div style="font-size:13px;color:var(--ink);margin-bottom:2px;">${p.address}</div>` : ''}
          ${p.phone ? `<a href="tel:${p.phone.replace(/[^\d+]/g,'')}" style="font-size:13px;color:var(--brand);text-decoration:none;">📞 ${p.phone}</a>` : ''}
          <div style="display:flex;gap:8px;margin-top:12px;">
            <div style="flex:1;">
              <label style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;">Status</label>
              <select onchange="setProspectStatus('${p.id}', this.value)" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
                <option value="new" ${status==='new'?'selected':''}>New</option>
                <option value="contacted" ${status==='contacted'?'selected':''}>Contacted</option>
                <option value="interested" ${status==='interested'?'selected':''}>Interested</option>
                <option value="not_interested" ${status==='not_interested'?'selected':''}>Not interested</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;">Priority</label>
              <select onchange="setProspectPriority('${p.id}', this.value)" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
                <option value="high" ${(p.priority||'medium')==='high'?'selected':''}>High</option>
                <option value="medium" ${(p.priority||'medium')==='medium'?'selected':''}>Medium</option>
                <option value="low" ${(p.priority||'medium')==='low'?'selected':''}>Low</option>
              </select>
            </div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;background:var(--paper-dim);border-radius:6px;cursor:pointer;">
            <input type="checkbox" onchange="convertProspectToClient('${p.id}', this)" style="width:18px;height:18px;">
            <span style="font-size:13px;font-weight:700;">✅ Already a client — add to portfolio</span>
          </label>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <a class="btn-secondary" style="flex:1;text-align:center;padding:6px 10px;font-size:12px;text-decoration:none;" href="${prospectSmsHref(p)}" onclick="event.stopPropagation()">💬 Text</a>
            <a class="btn-secondary" style="flex:1;text-align:center;padding:6px 10px;font-size:12px;text-decoration:none;" href="${prospectEmailHref(p)}" onclick="event.stopPropagation()">✉️ Email</a>
          </div>
          <button class="btn-secondary" style="width:100%;margin-top:8px;padding:6px 10px;font-size:12px;color:var(--hazard-dark);" onclick="event.stopPropagation();deleteProspect('${p.id}')">🗑️ Delete prospect</button>
        </div>
      ` : ''}
    </div>
  `;
  };

  return `
    <div class="topbar">
      <div class="brand"><div class="eyebrow">STORE DASHBOARD</div><div class="title">Prospects (${list.length})</div></div>
      <button class="ghost" onclick="exitStoreProspects()">Back</button>
    </div>
    <main>
      <p style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">🎯 These aren't clients yet — just leads you want to send promos or offers to.</p>
      ${state.showAddProspect ? `
        <div class="card" style="padding:14px;margin-bottom:14px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:10px;">New prospect</div>
          <input id="newProspectName" placeholder="Business name" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
          <input id="newProspectPhone" placeholder="Phone" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
          <input id="newProspectAddress" placeholder="Address" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
          <input id="newProspectCategory" placeholder="Type of business (e.g. Fencing)" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
          <input id="newProspectZone" placeholder="Zone (e.g. Pensacola / Milton, FL)" style="width:100%;margin-bottom:10px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
          <div style="display:flex;gap:8px;">
            <button class="btn-primary" style="flex:1;" onclick="saveNewProspect()">Save</button>
            <button class="btn-secondary" style="flex:1;" onclick="state.showAddProspect=false;render()">Cancel</button>
          </div>
        </div>
      ` : `
        <div class="acct-btn" style="padding:10px 14px;margin-bottom:14px;" onclick="state.showAddProspect=true;render()">
          <div class="meta" style="margin:0;">➕ Add a new prospect</div>
        </div>
      `}
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <select onchange="setProspectZoneFilter(this.value)" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
          <option value="all">All Zones</option>
          ${allZones.map(z => `<option value="${z}" ${zoneFilter===z?'selected':''}>${z}</option>`).join('')}
        </select>
        <select onchange="setProspectIndustryFilter(this.value)" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
          <option value="all">All Industries</option>
          ${allIndustries.map(c => `<option value="${c}" ${industryFilter===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <input id="prospectSearchInput" type="text" placeholder="Search by name or business type…" value="${state.prospectSearch||''}" oninput="setProspectSearch(this.value)" style="width:100%;margin-bottom:14px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
      ${list.length ? list.map(rowHtml).join('') : `<div class="empty-note"><span class="empty-icon">🎯</span>No prospects yet.</div>`}
    </main>
  `;
}
function setProspectZoneFilter(val) {
  state.prospectZoneFilter = val;
  render();
}
function setProspectIndustryFilter(val) {
  state.prospectIndustryFilter = val;
  render();
}
const renderProspectSearchDebounced = debounce(() => {
  render();
  const input = document.getElementById('prospectSearchInput');
  if (input) { input.focus(); input.setSelectionRange(state.prospectSearch.length, state.prospectSearch.length); }
}, 200);
function setProspectSearch(val) {
  state.prospectSearch = val;
  renderProspectSearchDebounced();
}
function toggleProspectExpand(id) {
  state.expandedProspectId = (state.expandedProspectId === id) ? null : id;
  render();
}
async function saveNewProspect() {
  const name = document.getElementById('newProspectName').value.trim();
  if (!name) { alert('Business name is required.'); return; }
  const phone = document.getElementById('newProspectPhone').value.trim();
  const address = document.getElementById('newProspectAddress').value.trim();
  const category = document.getElementById('newProspectCategory').value.trim();
  const zone = document.getElementById('newProspectZone').value.trim();
  const id = 'p_' + Date.now();
  const rep = currentRep();
  state.data.prospects[id] = { id, name, phone, address, category, zone, status: 'new', priority: 'medium', addedDate: Date.now(), lastContactDate: null, repId: rep ? rep.id : null };
  await setData('prospects', state.data.prospects);
  state.showAddProspect = false;
  render();
}
async function deleteProspect(id) {
  if (!confirm('Delete this prospect?')) return;
  delete state.data.prospects[id];
  await setData('prospects', state.data.prospects);
  render();
}
async function setProspectStatus(id, status) {
  const p = state.data.prospects[id];
  if (!p) return;
  p.status = status;
  if (status !== 'new') p.lastContactDate = Date.now();
  await setData('prospects', state.data.prospects);
  render();
}
async function setProspectPriority(id, priority) {
  const p = state.data.prospects[id];
  if (!p) return;
  p.priority = priority;
  await setData('prospects', state.data.prospects);
  render();
}
function slugify(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 40) || ('client' + Date.now());
}
async function convertProspectToClient(id, checkboxEl) {
  const p = state.data.prospects[id];
  if (!p) return;
  const rep = currentRep();
  if (!rep) {
    alert('Switch to your rep view (not "Manager view") before converting a prospect, so it gets assigned to the right rep.');
    if (checkboxEl) checkboxEl.checked = false;
    return;
  }
  if (!confirm(`Add "${p.name}" as a real client? This creates their account and removes them from Prospects.`)) {
    if (checkboxEl) checkboxEl.checked = false;
    return;
  }
  let slug = slugify(p.name);
  let finalSlug = slug;
  let n = 1;
  while (Object.values(state.data.accounts || {}).some(a => a.slug === finalSlug)) {
    finalSlug = slug + (++n);
  }
  const accId = 'acc_' + Date.now();
  state.data.accounts[accId] = {
    id: accId, slug: finalSlug, name: p.name, category: p.category || 'Other',
    ownerPin: '0000', balance: 0,
    clientPhone: p.phone || '',
    rep: { name: rep.name, phone: rep.phone },
    locations: p.address ? [{ id: 'loc1', name: p.address }] : []
  };
  state.data.accountProducts[accId] = [];
  await setData('accounts', state.data.accounts);
  await saveAccountProductsForAccount(accId, []);
  await syncClientLink(state.data.accounts[accId]);
  delete state.data.prospects[id];
  await setData('prospects', state.data.prospects);
  render();
  alert(`Added! Their link: ${location.origin}/${finalSlug}`);
}
function prospectSmsHref(p) {
  const msg = `Hi, this is Sergio with SC. I wanted to reach out about our products and current promotions — let me know if you'd like more info!`;
  const phone = p.phone ? p.phone.replace(/[^\d+]/g,'') : '';
  return `sms:${phone}?body=${encodeURIComponent(msg)}`;
}
function prospectEmailHref(p) {
  const subject = `SC — products & promotions`;
  const body = `Hi,\n\nThis is Sergio with SC. I wanted to reach out about our products and current promotions.\n\nLet me know if you'd like more info or a quote.\n\nSergio Leon (7605)\n(850) 816-6447`;
  return `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function quickDeleteOrder(orderId, origin) {
  // Routes through the same type-the-client's-name confirmation as the order
  // detail screen — no shortcut to a one-tap delete from the list view.
  openOrder(orderId, origin);
  state.confirmDeleteOrder = true;
  render();
}

let openOrderId = null;
// `origin` remembers which list screen this order was opened from (the pending
// Incoming Orders dashboard vs. the Sent Orders archive) so the detail screen's
// Back button returns you there instead of always landing on Incoming Orders.
function openOrder(id, origin) {
  openOrderId = id;
  state.orderDetailOrigin = origin || 'store';
  state.view = 'orderDetail';
  state.editingOrderItems = false;
  state.confirmDeleteOrder = false;
  state.deleteConfirmText = '';
  render();
}

function renderOrderDetail() {
  const o = state.data.orders[openOrderId];
  const editing = !!state.editingOrderItems;
  const backView = state.orderDetailOrigin || 'store';
  return `
    <div class="topbar">
      <div class="brand"><div class="eyebrow">${escapeHtml(o.locationName)}</div><div class="title">${escapeHtml(o.accountName)}</div></div>
      <button class="ghost" onclick="state.view='${backView}';render()">Back</button>
    </div>
    <main>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div class="tab ${o.status==='sent'?'sent':''}" style="width:auto;padding:8px 14px;pointer-events:none;">${o.status==='sent' ? '✅ Sent' : '🟠 Pending'}</div>
        ${!editing ? `<button class="btn-secondary" style="width:auto;padding:6px 14px;font-size:12px;" onclick="state.editingOrderItems=true;render()">✏️ Edit</button>` : ''}
      </div>
      <div class="ticket">
        <div style="font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:10px;">
          ORDER #${o.id.slice(-6).toUpperCase()} — ${new Date(o.timestamp).toLocaleString('en-US')}
        </div>
        ${(() => {
          const acct = state.data.accounts[o.accountId];
          const repName = acct && acct.rep ? acct.rep.name : 'Unknown rep';
          return `<div style="font-size:12.5px;color:var(--steel);font-weight:600;margin-bottom:10px;">👤 Rep: ${repName}</div>`;
        })()}
        ${o.neededBy ? `<div class="date-chip" style="margin-bottom:12px;">📅 Customer needs it by ${formatFriendlyDate(o.neededBy)}</div>` : ''}
        ${o.items.map((i, idx) => editing ? `
          <div class="ticket-line">
            <div class="item-icon" style="width:36px;height:36px;">${itemVisual(i)}</div>
            <span style="flex:1;">${escapeHtml(i.name)}<br><span style="color:var(--ink-soft);font-size:11.5px;">${escapeHtml(i.unit||'')}(s)</span></span>
            <div class="qty-stepper">
              <button onclick="editOrderItemQty(${idx}, -1)">−</button>
              <input type="number" min="1" inputmode="numeric" value="${i.qty}" onchange="setOrderItemQty(${idx}, this.value)" />
              <button onclick="editOrderItemQty(${idx}, 1)">+</button>
            </div>
            <button class="add-btn" style="background:var(--hazard-dark);" onclick="removeOrderItem(${idx})" title="Remove item">✕</button>
          </div>
        ` : `
          <div class="ticket-line">
            <div class="item-icon" style="width:36px;height:36px;">${itemVisual(i)}</div>
            <span style="flex:1;">${escapeHtml(i.name)}<br><span style="color:var(--ink-soft);font-size:11.5px;">${escapeHtml(i.unit||'')}(s)</span></span>
            <span class="mono" style="font-size:13px;padding:4px 10px;background:var(--paper-dim);border-radius:8px;">${i.qty} ${i.unit}(s)</span>
          </div>
        `).join('')}
      </div>
      ${o.comment ? `
        <div class="comment-box" style="margin-top:16px;">
          <label>Customer Comment</label>
          <div style="background:var(--white);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13.5px;">${escapeHtml(o.comment)}</div>
        </div>
      ` : ''}
      ${o.location ? `
        <a href="https://www.google.com/maps?q=${o.location.lat},${o.location.lng}" target="_blank" rel="noopener" class="btn-secondary" style="display:block;text-align:center;text-decoration:none;margin-top:16px;">${t('view_location')}</a>
      ` : ''}

      ${editing ? `
        <button class="btn-primary" style="background:var(--success);margin-top:18px;" onclick="state.editingOrderItems=false;render()">Save</button>
      ` : (o.status !== 'sent' ? `
        <button class="btn-primary" style="background:var(--success);margin-top:18px;" onclick="setOrderStatus('sent')">${t('receive_order_btn')}</button>
      ` : '')}

      ${!editing ? (state.confirmDeleteOrder ? `
        <div class="card" style="margin-top:18px;padding:14px;border:1px solid var(--hazard-dark);">
          <p style="font-size:13px;margin-bottom:8px;">To delete this order, type the client's name exactly as shown: <b>${escapeHtml(o.accountName)}</b></p>
          <input type="text" placeholder="${escapeHtml(o.accountName)}" value="${escapeHtml(state.deleteConfirmText||'')}" oninput="state.deleteConfirmText=this.value" style="width:100%;margin-bottom:10px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
          <div style="display:flex;gap:8px;">
            <button class="btn-secondary" style="flex:1;border-color:var(--hazard-dark);color:var(--hazard-dark);" onclick="confirmDeleteOrder()">Delete</button>
            <button class="btn-secondary" style="flex:1;" onclick="state.confirmDeleteOrder=false;state.deleteConfirmText='';render()">Cancel</button>
          </div>
        </div>
      ` : `
        <div style="text-align:center;margin-top:22px;">
          <span style="font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;" onclick="state.confirmDeleteOrder=true;state.deleteConfirmText='';render()">Delete this order</span>
        </div>
      `) : ''}
    </main>
  `;
}
function confirmDeleteOrder() {
  const o = state.data.orders[openOrderId];
  const typed = (state.deleteConfirmText || '').trim();
  if (typed !== o.accountName) {
    alert("That doesn't match the client's name exactly. Order not deleted.");
    return;
  }
  deleteOrder();
}
function editOrderItemQty(idx, delta) {
  const o = state.data.orders[openOrderId];
  const item = o.items[idx];
  item.qty = Math.max(1, item.qty + delta);
  o.total = o.items.reduce((s,i) => s + i.price*i.qty, 0);
  updateOrderFields(openOrderId, { items: o.items, total: o.total });
  render();
}
function setOrderItemQty(idx, value) {
  const o = state.data.orders[openOrderId];
  const item = o.items[idx];
  item.qty = Math.max(1, Math.floor(Number(value)) || 1);
  o.total = o.items.reduce((s,i) => s + i.price*i.qty, 0);
  updateOrderFields(openOrderId, { items: o.items, total: o.total });
  render();
}
function removeOrderItem(idx) {
  const o = state.data.orders[openOrderId];
  if (o.items.length <= 1) { alert('An order needs at least one item. Delete the order instead.'); return; }
  o.items.splice(idx, 1);
  o.total = o.items.reduce((s,i) => s + i.price*i.qty, 0);
  updateOrderFields(openOrderId, { items: o.items, total: o.total });
  render();
}
async function deleteOrder() {
  delete state.data.orders[openOrderId];
  await deleteOrderDoc(openOrderId);
  updateStoreAlerts();
  state.view = 'store';
  render();
}
async function setOrderStatus(s) {
  state.data.orders[openOrderId].status = s;
  render();
  await updateOrderFields(openOrderId, { status: s });
  updateStoreAlerts();
  if (s === 'sent') {
    showStamp('Sent ✓', true);
    setTimeout(() => { state.view = 'store'; render(); }, 1200);
  }
}

init();
</script>
</body>
</html>
